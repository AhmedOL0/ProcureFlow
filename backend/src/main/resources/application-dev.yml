# Local development profile. Run with `./mvnw spring-boot:run -Dspring-boot.run.profiles=dev`
# or set SPRING_PROFILES_ACTIVE=dev. Requires the compose stack (postgres/redis/rabbitmq).
spring:
  jpa:
    show-sql: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false # no listeners in Phase 1; avoids blocking on a missing broker

logging:
  level:
    com.procureflow: DEBUG
    org.hibernate.SQL: WARN

app:
  cors:
    # Local SPA origin. Production sets CORS_ALLOWED_ORIGINS instead;
    # empty means same-origin only.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
