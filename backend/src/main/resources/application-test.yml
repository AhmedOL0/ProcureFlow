# Test profile for Testcontainers-based integration tests (Phase 2+).
# The container URL/user/password are injected by the test bootstrap;
# Flyway migrates the schema so tests run against the real migration chain.
server:
  port: 0

spring:
  # Datasource comes from the @ServiceConnection PostgreSQLContainer
  # declared in AbstractIntegrationTest; nothing to configure here.
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Query-count gates (AnalyticsIT) read SessionFactory statistics;
        # collection overhead is negligible for integration tests.
        generate_statistics: true
  flyway:
    enabled: true
  data:
    mongodb:
      # Hermetic by default: no test touches shared mongo unless it brings
      # its own container (DynamicPropertySource overrides this, which wins).
      # Without it, extract tests would write junk docs into dev mongo
      # whenever it happens to run (lived once as acme-* debris).
      uri: mongodb://localhost:9/hermetic?serverSelectionTimeoutMS=1000&connectTimeoutMS=1000

app:
  jwt:
    # Fixed 64-char test key (HS512 needs >= 512 bits). Never used outside tests.
    secret: test-only-jwt-secret-0123456789-abcdefghijklmnopqrstuvwxyz-0123456789

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.procureflow: INFO
