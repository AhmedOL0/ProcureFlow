# Test profile for Testcontainers-based integration tests (Phase 2+).
# The container URL/user/password are injected by the test bootstrap;
# Flyway migrates the schema so tests run against the real migration chain.
server:
  port: 0

spring:
  # Datasource comes from the @ServiceConnection PostgreSQLContainer
  # declared in AbstractIntegrationTest; nothing to configure here.
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    listener:
      simple:
        auto-startup: false

app:
  jwt:
    # Fixed 64-char test key (HS512 needs >= 512 bits). Never used outside tests.
    secret: test-only-jwt-secret-0123456789-abcdefghijklmnopqrstuvwxyz-0123456789

logging:
  level:
    com.procureflow: INFO
