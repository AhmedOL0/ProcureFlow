name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly tripwire

jobs:
  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      # Gate what ships. The frontend image is multi-stage: only dist/ reaches
      # nginx, so Angular CLI, Vite and Vitest advisories cannot affect users.
      - name: Audit runtime dependencies (gate)
        run: npm audit --omit=dev --audit-level=high
      # Keep dev-toolchain advisories visible without blocking every build:
      # picomatch has no patched release (GHSA-fc5q-39xc-vjpf) and Angular
      # pins it exactly, so this report cannot go green until upstream ships.
      - name: Audit dev toolchain (non-blocking)
        continue-on-error: true
        run: npm audit --audit-level=high
