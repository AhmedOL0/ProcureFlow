name: backend-ci

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Verify (unit + architecture tests + coverage report)
        working-directory: backend
        run: ./mvnw -B verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

  api-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: contract-test-only
          POSTGRES_DB: procurflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps (pinned generator)
        working-directory: frontend
        run: npm ci --no-audit

      - name: Package backend (skip tests)
        working-directory: backend
        run: ./mvnw -B -DskipTests package

      - name: Boot backend with docs enabled
        working-directory: backend
        run: nohup java -jar target/procureflow-*.jar > /tmp/boot.log 2>&1 &
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/procureflow
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: contract-test-only
          JWT_SECRET: contract-test-only-jwt-secret-0123456789-abcdef-0123456789-abcdef
          API_DOCS_ENABLED: "true"

      - name: Generated types match the live contract
        working-directory: frontend
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/v3/api-docs -o /tmp/spec.json && break || sleep 5
          done
          npx --no-install openapi-typescript http://localhost:8080/v3/api-docs -o /tmp/fresh.gen.ts
          diff -u src/lib/api-types.gen.ts /tmp/fresh.gen.ts || (
            echo 'api-types.gen.ts is stale: run npm run gen:api against a dev backend and commit the result.'
            exit 1
          )
