server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers. The API origin is baked at image build time next to
  # environment.ts (same ARG): without it, connect-src would fall back to
  # 'self' and same-image API calls on another port would break.
  # style-src keeps 'unsafe-inline': Angular overlays and chart tooltips
  # position themselves through inline styles, which CSP would otherwise
  # block. No inline <script> exists (see src/index.html), so script-src
  # stays strict. HSTS is intentionally absent: this image serves plain
  # HTTP behind whatever terminates TLS, and HSTS on http is ignored.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' __ANGULAR_API_URL__; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;

  # SPA fallback: Angular Router handles client-side routes.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Static assets: aggressive caching (filenames are content-hashed).
  # NOTE: any add_header here replaces the server-level ones for these
  # responses (nginx inheritance), so the security headers repeat.
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' __ANGULAR_API_URL__; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Text compression for the app shell and API-shaped payloads.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
