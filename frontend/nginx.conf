server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: Angular Router handles client-side routes.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Static assets: aggressive caching (filenames are content-hashed).
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Text compression for the app shell and API-shaped payloads.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
