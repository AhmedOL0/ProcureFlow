<h2 mat-dialog-title>{{ lang.t('sup.recordTitle') }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="dialog-form" (ngSubmit)="save()">
    <mat-form-field appearance="outline">
      <mat-label>{{ lang.t('sup.periodLabel') }}</mat-label>
      <input matInput formControlName="period" placeholder="2026-10" />
      @if (form.controls.period.touched && form.controls.period.invalid) {
        <mat-error>{{ lang.t('sup.periodError') }}</mat-error>
      }
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>{{ lang.t('sup.onTimeLabel') }}</mat-label>
      <input matInput type="number" formControlName="onTimeRate" min="0" max="100" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>{{ lang.t('sup.qualityLabel') }}</mat-label>
      <input matInput type="number" formControlName="qualityScore" min="0" max="100" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>{{ lang.t('sup.colNotes') }}</mat-label>
      <textarea matInput formControlName="notes" rows="2"></textarea>
    </mat-form-field>
    @if (failure()) {
      <p class="dialog-error" role="alert">{{ failure() }}</p>
    }
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>{{ lang.t('dialog.cancel') }}</button>
  <button mat-flat-button color="primary" (click)="save()" [disabled]="busy()">
    @if (busy()) {
      <mat-spinner diameter="18" />
    } @else {
      {{ lang.t('sup.record') }}
    }
  </button>
</mat-dialog-actions>
