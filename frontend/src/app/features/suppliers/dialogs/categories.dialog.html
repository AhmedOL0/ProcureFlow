<h2 mat-dialog-title>Manage categories</h2>
<mat-dialog-content>
  <div class="dialog-form">
    <mat-form-field appearance="outline">
      <mat-label>Assigned categories</mat-label>
      <mat-select [formControl]="selection" multiple>
        @for (category of catalog(); track category.id) {
          <mat-option [value]="category.id">{{ category.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>New category name</mat-label>
      <input matInput [formControl]="newName" maxlength="200" />
    </mat-form-field>
    <div>
      <button mat-stroked-button (click)="createCategory()" [disabled]="!newName.value.trim() || busy()">
        Add to catalog
      </button>
    </div>
    @if (failure()) {
      <p class="dialog-error" role="alert">{{ failure() }}</p>
    }
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-flat-button color="primary" (click)="save()" [disabled]="busy()">
    @if (busy()) {
      <mat-spinner diameter="18" />
    } @else {
      Save categories
    }
  </button>
</mat-dialog-actions>
