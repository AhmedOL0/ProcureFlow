<h2 mat-dialog-title>{{ lang.t('inv.payTitle') }}</h2>
<mat-dialog-content>
  <div class="dialog-form">
    <p class="dialog-hint">{{ lang.tx('inv.remainingHint', { x: formatMinor(data.remaining, data.currency) }) }}</p>
    <mat-form-field appearance="outline">
      <mat-label>{{ lang.t('inv.amountLabel') }}</mat-label>
      <input matInput type="number" [formControl]="amount" min="1" [max]="data.remaining" step="1" />
      @if (amount.touched && amount.invalid) {
        <mat-error>{{ lang.t('inv.amountError') }}</mat-error>
      }
    </mat-form-field>
    @if (failure()) {
      <p class="dialog-error" role="alert">{{ failure() }}</p>
    }
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>{{ lang.t('dialog.cancel') }}</button>
  <button mat-flat-button color="primary" (click)="save()" [disabled]="busy()">
    @if (busy()) {
      <mat-spinner diameter="18" />
    } @else {
      {{ lang.t('inv.payTitle') }}
    }
  </button>
</mat-dialog-actions>
