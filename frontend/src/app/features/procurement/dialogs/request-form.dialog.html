<h2 mat-dialog-title>{{ isCreate() ? 'New request' : 'Edit request' }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="dialog-form" (ngSubmit)="save()">
    <mat-form-field appearance="outline">
      <mat-label>Title</mat-label>
      <input matInput formControlName="title" maxlength="200" placeholder="20 laptops for onboarding" />
      @if (form.controls.title.hasError('required') && form.controls.title.touched) {
        <mat-error>Title is required.</mat-error>
      }
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="2"></textarea>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Priority</mat-label>
      <mat-select formControlName="priority">
        @for (priority of priorities; track priority) {
          <mat-option [value]="priority">{{ priority }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    @if (failure()) {
      <p class="dialog-error" role="alert">{{ failure() }}</p>
    }
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-flat-button color="primary" (click)="save()" [disabled]="busy()">
    @if (busy()) {
      <mat-spinner diameter="18" />
    } @else {
      {{ isCreate() ? 'Create draft' : 'Save changes' }}
    }
  </button>
</mat-dialog-actions>
