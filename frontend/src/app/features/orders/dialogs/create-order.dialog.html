<h2 mat-dialog-title>New order</h2>
<mat-dialog-content>
  <div class="dialog-form">
    <mat-form-field appearance="outline">
      <mat-label>Approved request</mat-label>
      <mat-select [formControl]="requestControl">
        @for (request of approved(); track request.id) {
          <mat-option [value]="request.id">{{ request.title }}</mat-option>
        }
      </mat-select>
      <mat-hint>Only approved requests can become orders.</mat-hint>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Supplier</mat-label>
      <mat-select [formControl]="supplierControl">
        @for (supplier of vendors(); track supplier.id) {
          <mat-option [value]="supplier.id">{{ supplier.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    @if (failure()) {
      <p class="dialog-error" role="alert">{{ failure() }}</p>
    }
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button
    mat-flat-button
    color="primary"
    (click)="save()"
    [disabled]="busy() || !requestControl.value || !supplierControl.value"
  >
    @if (busy()) {
      <mat-spinner diameter="18" />
    } @else {
      Create draft order
    }
  </button>
</mat-dialog-actions>
