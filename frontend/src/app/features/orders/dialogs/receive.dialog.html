<h2 mat-dialog-title>{{ lang.t('ord.receive') }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="dialog-form">
    @for (row of rows(); track row.itemId) {
      <mat-form-field appearance="outline">
        <mat-label>{{ lang.tx('ord.rowLabel', { desc: row.description, n: row.outstanding }) }}</mat-label>
        <input
          matInput
          type="number"
          [formControl]="row.control"
          min="0"
          [max]="row.outstanding"
          step="1"
        />
        @if (row.control.touched && row.control.invalid) {
          <mat-error>{{ lang.tx('ord.rowError', { max: row.outstanding }) }}</mat-error>
        }
      </mat-form-field>
    }
    @if (failure()) {
      <p class="dialog-error" role="alert">{{ failure() }}</p>
    }
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>{{ lang.t('dialog.cancel') }}</button>
  <button mat-flat-button color="primary" (click)="save()" [disabled]="busy()">
    @if (busy()) {
      <mat-spinner diameter="18" />
    } @else {
      {{ lang.t('ord.receive') }}
    }
  </button>
</mat-dialog-actions>
