# ProcureFlow local Prometheus. Scrape the backend actuator plus itself.
# Start alongside the stack (Phase 2+): add a `prometheus` service to
# docker-compose.yml mounting this directory. Until then this file
# documents the intended scrape topology.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: procureflow-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
