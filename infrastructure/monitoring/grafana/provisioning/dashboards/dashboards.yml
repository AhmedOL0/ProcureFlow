apiVersion: 1

providers:
  - name: procureflow
    folder: ProcureFlow
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # Served from /var/lib: mounting the JSON dir under /etc/grafana
      # would shadow this provider file itself (same parent mount).
      path: /var/lib/grafana/dashboards
