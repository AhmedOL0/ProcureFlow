# TLS edge for the production-shape overlay. Terminates HTTPS on :443 and
# proxies the SPA plus /api to the internal services; /actuator is NOT
# proxied (metrics stay container-network-only for Prometheus).
# Certificates live in /tls (tlsdata volume): this image generates a
# throwaway self-signed pair on first boot so the overlay runs anywhere,
# and the runbook (infrastructure/prod/README.md) shows the swap for
# real ACME certificates. Never commit real keys here.
server {
  listen 443 ssl;
  server_name _;

  ssl_certificate /tls/edge.crt;
  ssl_certificate_key /tls/edge.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;

  # HSTS only makes sense once a real name + certificate serve this edge;
  # the snakeoil boot keeps it commented so local testing never pins HSTS.
  # add_header Strict-Transport-Security "max-age=63072000" always;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;

  # SPA + static assets.
  location / {
    proxy_pass http://frontend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # /actuator is deliberately NOT proxied: metrics stay on the container
  # network for Prometheus. Without this block location / would serve the
  # SPA fallback with a 200 for actuator paths (confusing, not leaking).
  location /actuator/ {
    return 404;
  }

  # API (large document uploads ride here).
  location /api/ {
    client_max_body_size 8m;
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}
